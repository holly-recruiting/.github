<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">Join Holly</title>
  <desc id="description">Build software government actually deserves. Explore open roles at Holly.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="85%">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="1" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <style>
      .sans { font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #a5b4fc; }
      .heading { font-size: 28px; font-weight: 700; fill: #ffffff; }
      .body { font-size: 14px; font-weight: 500; fill: #94a3b8; }
      .button { font-size: 13px; font-weight: 700; letter-spacing: 0.4px; fill: #ffffff; }
    </style>
  </defs>

  <rect width="960" height="240" rx="12" fill="#080c14" />
  <rect width="960" height="240" rx="12" fill="url(#glow)" />
  <rect x="1" y="1" width="958" height="238" rx="11" fill="none" stroke="#1e2836" />

  <text class="sans eyebrow" x="480" y="48" text-anchor="middle">JOIN HOLLY</text>
  <text class="sans heading" x="480" y="87" text-anchor="middle">Build software government actually deserves.</text>
  <text class="sans body" x="480" y="116" text-anchor="middle">Small team. Real ownership. Public-service impact.</text>

  <rect x="376" y="146" width="208" height="48" rx="8" fill="url(#accent)" />
  <text class="sans button" x="480" y="176" text-anchor="middle">EXPLORE OPEN ROLES  →</text>
</svg>
