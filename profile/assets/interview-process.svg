<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">Holly engineering interview process</title>
  <desc id="description">Three remote interviews establish technical fit before five onsite interviews focused on working together.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#768888" />
    </marker>
    <style>
      .sans { font-family: 'Geist', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 20px; font-weight: 700; fill: #ffffff; }
      .stage { font-size: 14px; font-weight: 600; fill: #e3e7e9; }
      .time { font-size: 12px; font-weight: 600; fill: #94a3b8; }
      .number { font-size: 11px; font-weight: 700; fill: #a5b4fc; }
      .muted { font-size: 12px; font-weight: 500; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="960" height="320" rx="12" fill="#080c14" />
  <rect x="1" y="1" width="958" height="318" rx="11" fill="none" stroke="#1e2836" />

  <text class="sans eyebrow" x="40" y="40" fill="#818cf8">INTERVIEW PROCESS</text>
  <text class="sans muted" x="920" y="40" text-anchor="end">Confirm technical fit first. Spend the onsite learning how we work together.</text>

  <g>
    <rect x="40" y="68" width="350" height="216" rx="10" fill="#101623" stroke="#2c3a4d" />
    <rect x="58" y="86" width="74" height="22" rx="11" fill="#818cf8" fill-opacity="0.16" />
    <text class="sans eyebrow" x="95" y="101" text-anchor="middle" fill="#a5b4fc">REMOTE</text>
    <text class="sans heading" x="58" y="136">Technical fit</text>

    <circle cx="70" cy="166" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="70" y="170" text-anchor="middle">1</text>
    <text class="sans stage" x="94" y="170">Phone screen</text>
    <text class="sans time" x="370" y="170" text-anchor="end">15 min</text>

    <circle cx="70" cy="208" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="70" y="212" text-anchor="middle">2</text>
    <text class="sans stage" x="94" y="212">Architectural assessment</text>
    <text class="sans time" x="370" y="212" text-anchor="end">45 min</text>

    <circle cx="70" cy="250" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="70" y="254" text-anchor="middle">3</text>
    <text class="sans stage" x="94" y="254">Coding assessment</text>
    <text class="sans time" x="370" y="254" text-anchor="end">75 min</text>
  </g>

  <path d="M 402 176 H 438" fill="none" stroke="#768888" stroke-width="2" marker-end="url(#arrow)" />
  <text class="sans eyebrow" x="420" y="157" text-anchor="middle" fill="#94a3b8">FIT</text>

  <g>
    <rect x="450" y="68" width="470" height="216" rx="10" fill="#101623" stroke="#2c3a4d" />
    <rect x="468" y="86" width="72" height="22" rx="11" fill="#34d399" fill-opacity="0.12" />
    <text class="sans eyebrow" x="504" y="101" text-anchor="middle" fill="#34d399">ONSITE</text>
    <text class="sans heading" x="468" y="136">How we work together</text>

    <circle cx="480" cy="166" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="480" y="170" text-anchor="middle">4</text>
    <text class="sans stage" x="504" y="170">Hiring manager</text>
    <text class="sans time" x="660" y="170" text-anchor="end">15 min</text>

    <circle cx="480" cy="208" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="480" y="212" text-anchor="middle">5</text>
    <text class="sans stage" x="504" y="212">Technical</text>
    <text class="sans time" x="660" y="212" text-anchor="end">45 min</text>

    <circle cx="480" cy="250" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="480" y="254" text-anchor="middle">6</text>
    <text class="sans stage" x="504" y="254">Values</text>
    <text class="sans time" x="660" y="254" text-anchor="end">45 min</text>

    <circle cx="700" cy="166" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="700" y="170" text-anchor="middle">7</text>
    <text class="sans stage" x="724" y="170">Product</text>
    <text class="sans time" x="900" y="170" text-anchor="end">45 min</text>

    <circle cx="700" cy="208" r="12" fill="#818cf8" fill-opacity="0.16" stroke="#818cf8" />
    <text class="sans number" x="700" y="212" text-anchor="middle">8</text>
    <text class="sans stage" x="724" y="212">Founders</text>
    <text class="sans time" x="900" y="212" text-anchor="end">30 min</text>

    <text class="sans muted" x="700" y="254">You are interviewing Holly too.</text>
  </g>
</svg>
