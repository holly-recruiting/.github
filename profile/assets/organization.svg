<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title" aria-describedby="description">
  <title id="title">How Holly engineering is organized</title>
  <desc id="description">Two delivery domains. Product builds the customer-facing application agencies use every day, across UI, full-stack, and API work. Data and AI turns messy government data into clean records and builds grounded AI on top, across ingestion, pipelines, and AI work. Small, stable pods own the work from first decision through production, and practices share standards, tooling, and reliability across every pod.</desc>

