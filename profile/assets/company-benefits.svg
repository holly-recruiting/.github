<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title" aria-describedby="description">
  <title id="title">Benefits for the whole Holly team</title>
  <desc id="description">Holly offers medical, dental, and vision coverage; a 401(k) match; early-employee equity; paid parental leave; paid time off and holidays; monthly wellness and commuter benefits; and an annual company retreat, held in Mexico City in 2025.</desc>

